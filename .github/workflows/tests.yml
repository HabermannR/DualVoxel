# The editor's tests on macOS and Linux, without the renderer: SKIP_GPU=1 leaves out the
# path-traced checks; the Qt window tests run on a real display (the macOS runner's own, Xvfb
# with Openbox on Linux). The render job runs the path-traced tests on Linux, on the CPU:
# the renderer from the newest release with a Linux zip, under Mesa's lavapipe.
name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04]  # macOS 14's runner image retires on 2 November 2026
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40  # the tests take about 15 minutes on macOS; a hang once ran into GitHub's six hours
    defaults:
      run:
        working-directory: editor
    env:
      SKIP_GPU: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - name: Qt's and VTK's system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb openbox libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 \
            libxcb-keysyms1 libxcb-shape0 libxcb-xinerama0 libxcb-randr0 libxcb-render-util0 libdbus-1-3
      - run: uv sync --frozen
      - name: Tests (macOS)
        if: runner.os == 'macOS'
        run: .venv/bin/python -m unittest discover -s tests
      - name: Tests (Linux)
        if: runner.os == 'Linux'
        # a window manager makes the editor's window the active one, so focus (and undo by focus) works.
        # Python here sometimes hung in native code at shutdown after every test had passed (tests/ci_run.py
        # leaves without it); should anything still hang, it is stopped after 20 minutes with SIGABRT, and
        # faulthandler prints where each thread was.
        run: >-
          xvfb-run -a -s "-screen 0 1920x1080x24" sh -c
          'openbox & sleep 2; timeout -s ABRT 20m .venv/bin/python -X faulthandler tests/ci_run.py'

  render:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: editor
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - name: Renderer (the newest release's Linux zip)
        id: renderer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh api "repos/${{ github.repository }}/releases" \
            --jq '[.[] | select(any(.assets[]; .name | startswith("renderer-linux-x64-")))][0].tag_name // empty')
          if [ -z "$tag" ]; then
            echo "::warning::No release has a renderer-linux-x64 zip yet: the path-traced tests did not run."
            exit 0
          fi
          gh release download "$tag" --repo "${{ github.repository }}" --pattern 'renderer-linux-x64-*.zip' --dir "$RUNNER_TEMP"
          unzip -q "$RUNNER_TEMP"/renderer-linux-x64-*.zip -d renderer
          echo "zip=$(basename "$RUNNER_TEMP"/renderer-linux-x64-*.zip)" >> "$GITHUB_OUTPUT"
      - name: Lavapipe, Qt's and VTK's system libraries
        if: steps.renderer.outputs.zip
        run: |
          sudo apt-get update
          sudo apt-get install -y mesa-vulkan-drivers libvulkan1 libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3
      # Mesa compiles the path tracer's shader for the CPU once, for some minutes, and keeps it here.
      - uses: actions/cache@v4
        if: steps.renderer.outputs.zip
        with:
          path: ~/.cache/mesa_shader_cache
          key: mesa-${{ steps.renderer.outputs.zip }}
      - run: uv sync --frozen
        if: steps.renderer.outputs.zip
      - name: Path-traced tests (lavapipe)
        if: steps.renderer.outputs.zip
        working-directory: editor/tests
        env:
          VK_DRIVER_FILES: /usr/share/vulkan/icd.d/lvp_icd.json
          QT_QPA_PLATFORM: offscreen
        run: ../.venv/bin/python -m unittest test_gas test_headless test_live_link test_surroundings
