# The editor's tests on macOS and Linux, without the renderer (it ships for Windows only):
# SKIP_GPU=1 leaves out the path-traced checks; the Qt window tests run on a real display
# (the macOS runner's own, Xvfb on Linux).
name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: editor
    env:
      SKIP_GPU: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Qt's and VTK's system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 \
            libxcb-keysyms1 libxcb-shape0 libxcb-xinerama0 libxcb-randr0 libxcb-render-util0 libdbus-1-3
      - run: uv sync --frozen
      - name: Tests (macOS)
        if: runner.os == 'macOS'
        run: .venv/bin/python -m unittest discover -s tests
      - name: Tests (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a -s "-screen 0 1920x1080x24" .venv/bin/python -m unittest discover -s tests
